<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上多人狼人殺</title>
<meta name="description" content="線上多人狼人殺：建一間房，把連結丟給朋友，6–12 人開局。">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="landing">
  <p class="kicker">即時多人 · 身分保密 · 伺服器判定勝負</p>
  <h1>線上多人<span class="acc">狼人殺</span></h1>
  <p class="sub">建一間房，把連結丟給朋友，6–12 人開局。<br>狼人、預言家與平民 —— 一夜一日，投票放逐，直到分出勝負。</p>

  <div class="landing-actions">
    <button id="create" class="btn-primary" type="button">建立房間</button>
    <form id="join-form" autocomplete="off">
      <input id="join-code" name="code" inputmode="latin" maxlength="6" placeholder="輸入 6 碼房號" aria-label="房號">
      <button class="btn-ghost" type="submit">加入</button>
    </form>
  </div>
  <p id="landing-err" class="err" hidden></p>

  <footer class="landing-foot">邀請連結即入場券 · 夜晚行動只給對應身分 · 斷線可回原座位</footer>
</main>

<script type="module" src="/landing.js"></script>
</body>
</html>
