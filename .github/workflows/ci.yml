name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/ > /dev/null && break
            sleep 1
          done
      - run: node scripts/e2e.mjs http://localhost:8787
